name: Docker Build and Push

on:
  workflow_dispatch:  # Enable manual triggers from the GitHub UI

  # schedule:
  #   - cron: '0 0 * * *'  # Run at 00:00 UTC every day

  push:
    branches: [ "main" ]  # Run on pushes to main branch
    paths:
      - 'Dockerfile*'     # Run when Dockerfiles change
      - '*.sh'            # Run when build script changes
      - '.github/workflows/*.yml'  # Run when workflows change

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cursord
  # Additional Docker registry (optional) - only password is stored as secret
  ADDITIONAL_REGISTRY_URL: ${{ vars.ADDITIONAL_REGISTRY_URL }}
  ADDITIONAL_REGISTRY_USERNAME: ${{ vars.ADDITIONAL_REGISTRY_USERNAME }}
  ADDITIONAL_IMAGE_NAME: ${{ vars.ADDITIONAL_IMAGE_NAME }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Resolve Node.js 20 deprecation warning

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Docker Hub credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "Error: DOCKERHUB_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Error: DOCKERHUB_TOKEN secret is not set"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Antigravity details
        run: |
          # Use date-based versioning for Antigravity to ensure nightly builds
          ANTIGRAVITY_VERSION=$(date -u +%Y%m%d)
          echo "ANTIGRAVITY_VERSION=${ANTIGRAVITY_VERSION}" >> $GITHUB_ENV
          echo "Antigravity version (date-based): ${ANTIGRAVITY_VERSION}"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Additional Docker Registry
        if: ${{ env.ADDITIONAL_REGISTRY_URL != '' && env.ADDITIONAL_REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ADDITIONAL_REGISTRY_URL }}
          username: ${{ env.ADDITIONAL_REGISTRY_USERNAME }}
          password: ${{ secrets.ADDITIONAL_REGISTRY_PASSWORD }}

      # Ubuntu image build
      - name: Check if Ubuntu Docker images exist
        id: check_ubuntu_image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - skipping version check"
            echo "UBUNTU_EXISTS=false" >> $GITHUB_ENV
          else
            # Check if the dated version already exists
            if docker manifest inspect ${{ env.IMAGE_NAME }}:v${ANTIGRAVITY_VERSION} > /dev/null 2>&1; then
              echo "Ubuntu image for version ${ANTIGRAVITY_VERSION} already exists"
              echo "UBUNTU_EXISTS=true" >> $GITHUB_ENV
            else
              echo "Ubuntu image for version ${ANTIGRAVITY_VERSION} does not exist"
              echo "UBUNTU_EXISTS=false" >> $GITHUB_ENV
            fi
          fi

      - name: Set up Docker Buildx for Ubuntu image
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker tags
        id: prepare_tags
        run: |
          # Base tags for Docker Hub
          TAGS="${{ env.IMAGE_NAME }}:v${{ env.ANTIGRAVITY_VERSION }}"
          TAGS="$TAGS,${{ env.IMAGE_NAME }}:latest"
          
          # Add additional registry tags if configured
          if [ -n "${{ env.ADDITIONAL_REGISTRY_URL }}" ] && [ -n "${{ env.ADDITIONAL_IMAGE_NAME }}" ]; then
            TAGS="$TAGS,${{ env.ADDITIONAL_REGISTRY_URL }}/${{ env.ADDITIONAL_IMAGE_NAME }}:v${{ env.ANTIGRAVITY_VERSION }}"
            TAGS="$TAGS,${{ env.ADDITIONAL_REGISTRY_URL }}/${{ env.ADDITIONAL_IMAGE_NAME }}:latest"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

      - name: Build and push Ubuntu Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.prepare_tags.outputs.tags }}

      - name: Log out from Docker Hub
        if: always()
        run: docker logout

      - name: Log out from Additional Docker Registry
        if: always() && env.ADDITIONAL_REGISTRY_URL != ''
        run: docker logout ${{ env.ADDITIONAL_REGISTRY_URL }} 
